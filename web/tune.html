<!doctype html><html><head><meta charset="utf-8"><title>tune</title>
<style>body{margin:0;background:#0B0A1F}#g{display:grid;grid-template-columns:1fr 1fr;gap:2px}
canvas{display:block;width:100%;height:440px}
.l{position:absolute;color:#FFA35C;font:11px ui-monospace;padding:4px}</style></head>
<body><div id="g"></div>
<script type="module">
import * as THREE from 'three';
import { loadHandPack } from '/src/three/handpack.js';
import { buildAssembly, setAssemblyExplode } from '/src/three/assembly.js';
const q=new URLSearchParams(location.search);
const T=parseFloat(q.get('t')||'0');
const mat=new THREE.MeshStandardMaterial({color:0xe4e7ec,roughness:.6,metalness:.05});
const parts=await loadHandPack(mat);
const g=document.getElementById('g');
// four camera angles
const VIEWS=[['3/4',[380,260,420]],['side +X',[620,60,0]],['top +Y',[0,640,40]],['front +Z',[0,60,620]]];
for(const [name,cp] of VIEWS){
  const wrap=document.createElement('div');wrap.style.position='relative';
  const lab=document.createElement('div');lab.className='l';lab.textContent=name;wrap.appendChild(lab);
  const cv=document.createElement('canvas');wrap.appendChild(cv);g.appendChild(wrap);
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  r.setSize(wrap.clientWidth,440,false);r.outputColorSpace=THREE.SRGBColorSpace;
  const sc=new THREE.Scene();
  sc.add(new THREE.AmbientLight(0xffffff,.65));
  const k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(3,6,4);sc.add(k);
  const f=new THREE.DirectionalLight(0x9fb6ff,.8);f.position.set(-5,1,-4);sc.add(f);
  const asm=buildAssembly(parts);setAssemblyExplode(asm,T);sc.add(asm);
  sc.add(new THREE.AxesHelper(120));
  const cam=new THREE.PerspectiveCamera(38,wrap.clientWidth/440,1,4000);
  cam.position.set(...cp);cam.lookAt(0,0,-60);
  r.render(sc,cam);
}
document.title='READY';
</script></body></html>
